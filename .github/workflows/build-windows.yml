name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask requests img2pdf pillow pyyaml pyinstaller

      - name: Build portable exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "xhs-study-pdf" `
            --icon "core_engine/static/XHS-Downloader.ico" `
            --add-data "web_frontend;web_frontend" `
            --add-data "core_engine;core_engine" `
            --add-data "home_edition;home_edition" `
            --hidden-import "img2pdf" --hidden-import "PIL" --hidden-import "yaml" `
            home_edition/desktop/main_gui.py

      - name: Compile installer (Inno Setup)
        run: |
          choco install innosetup -y
          iscc packaging/windows/installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/xhs-study-pdf.exe
            dist/*-setup*.exe
