name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flask requests img2pdf pillow pyyaml pyinstaller

      - name: Build macOS app
        run: |
          python3 -m PyInstaller --noconfirm --windowed --name "xhs-study-pdf" \
            --icon "core_engine/static/XHS-Downloader.icns" \
            --add-data "web_frontend:web_frontend" \
            --add-data "core_engine:core_engine" \
            --add-data "home_edition:home_edition" \
            --hidden-import "img2pdf" --hidden-import "PIL" --hidden-import "yaml" \
            home_edition/desktop/main_gui.py

      - name: Build dmg
        run: |
          brew install create-dmg
          bash packaging/macos/build_dmg.sh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
