version: "3.8"

services:
  xhs-study-pdf:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    container_name: xhs-study-pdf
    ports:
      - "5088:5088"
    environment:
      - RUN_MODE=lan
      - XHS_OUTPUT_DIR=/output
    volumes:
      # 自定义输出目录:把宿主机目录挂载到容器内 /output
      - ./downloads:/output
    restart: unless-stopped
